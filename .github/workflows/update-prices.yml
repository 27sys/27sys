name: Mise à jour des prix Maroc

on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Refresh price feed
        run: python3 scripts/update-prices.py
      - name: Commit if changed
        run: |
          git config user.name '27sys price monitor'
          git config user.email 'actions@github.com'
          if git diff --quiet -- knowledge/pricing.json; then
            echo 'Aucun changement de prix.'
          else
            git add knowledge/pricing.json
            git commit -m 'chore: refresh Morocco equipment prices'
            git push
          fi
