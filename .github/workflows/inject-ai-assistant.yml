name: Inject 27sys AI Assistant

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject AI assistant script tag
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script type="module" src="js/ai-assistant.js"></script>'
          if tag not in text:
              marker = '<script src="js/config.js"></script>'
              if marker not in text:
                  raise SystemExit('Could not find config.js script marker in index.html')
              text = text.replace(marker, marker + '\n' + tag, 1)
              p.write_text(text, encoding='utf-8')
              print('Injected AI assistant script tag.')
          else:
              print('AI assistant script tag already present.')
          PY

      - name: Commit and push
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Enable 27sys browser AI assistant'
          git push
